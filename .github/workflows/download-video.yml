name: Download Video to Repository

on:
  workflow_dispatch:  # Manual trigger
  # schedule:
  #   - cron: '0 0 * * *'  # Optional: run daily

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install axios
    
    - name: Run video downloader
      run: node download-video.js
    
    - name: Commit and push video file
      run: |
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add the downloaded video
        git add downloads/
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Add downloaded video [skip actions]"
          git push
        fi
    
    - name: Display download info
      run: |
        echo "📁 Video saved to repository in 'downloads/' folder:"
        ls -lh downloads/
        echo ""
        echo "💾 Total size:"
        du -sh downloads/
